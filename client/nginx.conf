# nginx for the web container (ADR 0004). A template: ${AUTH0_DOMAIN} is filled from the container env at
# start, __THEME_SCRIPT_HASH__ at image build. nginx's own $variables are left alone by envsubst.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Server-level headers are inherited only by locations without their own add_header, so locations
    # below set caching with `expires`, not add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' '__THEME_SCRIPT_HASH__'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://${AUTH0_DOMAIN} https://api.cloudinary.com; frame-src https://${AUTH0_DOMAIN}; form-action 'self' https://${AUTH0_DOMAIN}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite's hashed files never change under the same name.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # The SPA shell: always revalidated, so a deploy is picked up on the next visit.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
